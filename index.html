<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widgets 16:9</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #09090b;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Видео-контейнер 16:9 */
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas {
      display: none;
    }

    /* Кнопка запуска PiP */
    .pip-btn {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff0055, #ff5500);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .pip-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>

  <!-- Контейнер плеера 16:9 -->
  <div class="video-wrapper">
    <video id="pipVideo" autoplay loop muted playsinline></video>
  </div>

  <!-- Скрытый Canvas 16:9 (1280x720) -->
  <canvas id="stage" width="1280" height="720"></canvas>

  <button class="pip-btn" onclick="togglePiP()">ОТКРЫТЬ В ПЛАВАЮЩЕМ ОКНЕ</button>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');
    const video = document.getElementById('pipVideo');

    let hue = 0;
    let scaleStep = 0;

    function draw() {
      hue = (hue + 2) % 360;
      scaleStep += 0.05;

      // Очистка и чёрный фон
      ctx.fillStyle = '#050508';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 1. Анимированная неоновая рамка (16:9)
      ctx.strokeStyle = `hsl(${hue}, 100%, 50%)`;
      ctx.lineWidth = 16;
      ctx.shadowColor = `hsl(${hue}, 100%, 50%)`;
      ctx.shadowBlur = 25;
      ctx.strokeRect(12, 12, canvas.width - 24, canvas.height - 24);

      // Сброс тени для текста
      ctx.shadowBlur = 0;

      // 2. Пульсирующая подложка под надпись
      const pulseScale = 1 + Math.sin(scaleStep) * 0.04;
      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.scale(pulseScale, pulseScale);

      // Отрисовка плашки
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 30;
      
      const rectW = 520;
      const rectH = 110;
      ctx.beginPath();
      ctx.roundRect(-rectW / 2, -rectH / 2, rectW, rectH, 30);
      ctx.fill();

      // Текст надписи
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 58px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ПОДПИШИТЕСЬ', 0, 4);

      ctx.restore();

      requestAnimationFrame(draw);
    }

    // Запуск отрисовки
    draw();

    // Захват потока 30 FPS и передача в <video>
    const stream = canvas.captureStream(30);
    video.srcObject = stream;

    // Переключение в режим PiP
    async function togglePiP() {
      try {
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else {
          await video.requestPictureInPicture();
        }
      } catch (err) {
        alert('Ошибка PiP: запустите файл через браузер Chrome на смартфоне!');
      }
    }
  </script>
</body>
</html>
