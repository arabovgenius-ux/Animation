<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ПОДПИШИТЕСЬ 16:9</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #09090b;
      color: #fff;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px;
    }
    .video-wrapper {
      position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 9;
      background: #000; border-radius: 16px; overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.1);
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }
    .pip-btn {
      margin-top: 20px; padding: 14px 28px; font-size: 16px; font-weight: 700; color: #fff;
      background: linear-gradient(135deg, #ff0055, #ff5500); border: none; border-radius: 12px;
      cursor: pointer; box-shadow: 0 4px 15px rgba(255,0,85,.4); transition: transform .2s;
    }
    .pip-btn:active { transform: scale(.96); }
    .pip-btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    #msg { margin-top: 12px; font-size: 13px; opacity: .7; text-align: center; min-height: 1.2em; }
  </style>
</head>
<body>

  <div class="video-wrapper">
    <video id="pipVideo" autoplay loop muted playsinline></video>
  </div>

  <canvas id="stage" width="1280" height="720"></canvas>

  <button class="pip-btn" id="btn" onclick="togglePiP()">ОТКРЫТЬ В ПЛАВАЮЩЕМ ОКНЕ</button>
  <div id="msg"></div>

  <script>
    const W = 1280, H = 720;
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const video = document.getElementById('pipVideo');
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    const COLORS = [[255,45,85],[255,204,0],[52,199,89],[0,199,255],[94,92,230],[255,149,0],[255,61,208]];

    // ---------- Предрендер: спрайты лампочек (свечение рисуется 1 раз, а не каждый кадр) ----------
    const R = 15, S = R * 5;               // радиус лампочки и размер спрайта
    const sprites = COLORS.map(([r, g, b]) => {
      const c = document.createElement('canvas'); c.width = c.height = S;
      const x = c.getContext('2d');
      const grad = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
      grad.addColorStop(0,    'rgba(255,255,255,1)');
      grad.addColorStop(0.18, `rgba(${r},${g},${b},1)`);
      grad.addColorStop(0.35, `rgba(${r},${g},${b},.55)`);
      grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
      x.fillStyle = grad; x.fillRect(0, 0, S, S);
      return c;
    });

    // ---------- Позиции лампочек по периметру ----------
    const M = 34, STEP = 52, bulbs = [];
    const add = (x, y) => bulbs.push({ x, y, p: bulbs.length, c: bulbs.length % COLORS.length });
    const nx = Math.round((W - 2*M) / STEP), ny = Math.round((H - 2*M) / STEP);
    for (let i = 0; i < nx; i++) add(M + (W - 2*M) * i / nx, M);
    for (let i = 0; i < ny; i++) add(W - M, M + (H - 2*M) * i / ny);
    for (let i = 0; i < nx; i++) add(W - M - (W - 2*M) * i / nx, H - M);
    for (let i = 0; i < ny; i++) add(M, H - M - (H - 2*M) * i / ny);

    // ---------- Статичный слой: фон + провод (рисуется один раз) ----------
    const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
    (() => {
      const b = bg.getContext('2d');
      b.fillStyle = '#050508'; b.fillRect(0, 0, W, H);
      b.strokeStyle = '#26202f'; b.lineWidth = 4;
      b.strokeRect(M, M, W - 2*M, H - 2*M);
    })();

    // ---------- Кадр ----------
    function draw(now) {
      const t = now / 1000;
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
      ctx.drawImage(bg, 0, 0);

      // Гирлянда: 3 режима, меняются каждые 6 сек
      const mode = Math.floor(t / 6) % 3;
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < bulbs.length; i++) {
        const b = bulbs[i];
        let a, ci = b.c;
        if (mode === 0)      a = 0.3 + 0.7 * Math.abs(Math.sin(t * 3 - b.p * 0.45));          // бегущая волна
        else if (mode === 1) a = ((Math.floor(t * 3) + b.p) & 1) ? 1 : 0.15;                  // шахматное мигание
        else { a = 0.5 + 0.5 * Math.sin(t * 5 + b.p * 1.7); ci = (b.c + Math.floor(t * 2)) % COLORS.length; } // хаос
        ctx.globalAlpha = a;
        ctx.drawImage(sprites[ci], b.x - S/2, b.y - S/2);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';

      // Пульсирующая плашка с неоновой подсветкой
      const hue = (t * 80) % 360;
      const pulse = 1 + Math.sin(t * 3) * 0.04;
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(pulse, pulse);

      const rw = 700, rh = 150;
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = `hsl(${hue},100%,55%)`;
      ctx.shadowBlur = 40;
      ctx.beginPath();
      ctx.roundRect(-rw/2, -rh/2, rw, rh, 40);
      ctx.fill();

      ctx.shadowBlur = 0;
      ctx.lineWidth = 6;
      ctx.strokeStyle = `hsl(${(hue + 180) % 360},100%,65%)`;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = '900 84px "Arial Black", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('ПОДПИШИТЕСЬ', 0, 6);
      ctx.restore();
    }

    // ---------- Таймер, который не засыпает в фоне ----------
    // requestAnimationFrame останавливается, когда вкладка скрыта (а в PiP она как раз скрыта).
    // Поэтому кадры считает Web Worker-таймер: он работает и при свёрнутой вкладке.
    let tick;
    try {
      const url = URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),33)'], { type: 'text/javascript' }));
      const worker = new Worker(url);
      worker.onmessage = () => draw(performance.now());
      tick = worker;
    } catch (e) {
      const loop = t => { draw(t); requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
    }
    draw(performance.now());

    // ---------- Поток canvas -> video ----------
    video.srcObject = canvas.captureStream(30);
    video.play().catch(() => {});

    // ---------- PiP ----------
    function setBtn() {
      const on = document.pictureInPictureElement === video || video.webkitPresentationMode === 'picture-in-picture';
      btn.textContent = on ? 'ЗАКРЫТЬ ПЛАВАЮЩЕЕ ОКНО' : 'ОТКРЫТЬ В ПЛАВАЮЩЕМ ОКНЕ';
    }
    video.addEventListener('enterpictureinpicture', setBtn);
    video.addEventListener('leavepictureinpicture', setBtn);
    video.addEventListener('webkitpresentationmodechanged', setBtn);

    async function togglePiP() {
      try {
        await video.play().catch(() => {});
        if (document.pictureInPictureElement) {
          await document.exitPictureInPicture();
        } else if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
          await video.requestPictureInPicture();
        } else if (video.webkitSetPresentationMode) {            // Safari / iOS
          video.webkitSetPresentationMode(
            video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
        } else {
          throw new Error('PiP не поддерживается');
        }
        msg.textContent = '';
      } catch (err) {
        msg.textContent = 'Не удалось открыть PiP. Откройте файл в Chrome / Edge / Safari.';
      }
      setBtn();
    }
  </script>
</body>
</html>
